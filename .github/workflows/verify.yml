name: Verify

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

jobs:
  release-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22.13.0'
          cache: npm
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
      - run: npm ci
      - run: python -m pip install -r services/requirements.txt
      - name: Gateway tests
        run: npm run test:gateway
      - name: Python tests
        run: npm run test:python
      - name: Tenant and recovery tests
        run: npm run test:tenants
      - name: Provider inventory tests
        run: npm run test:provider-inventory
      - name: Grounding gate
        run: npm run test:grounding
      - name: Frontend build
        run: npm run build
      - name: Dependency audit
        run: npm run audit:all
