<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/veyra.svg" />
    <script>
      try {
        document.documentElement.classList.toggle(
          'dark',
          localStorage.getItem('veyra-theme') !== 'light'
        );
      } catch {
        document.documentElement.classList.add('dark');
      }
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Veyra — AI agents that understand every customer conversation</title>
    <meta
      name="description"
      content="Veyra brings voice agents, reviewed knowledge, and conversation insights into one workspace."
    />
    <meta name="theme-color" content="#101319" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
